[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "redis-ratekit"
version = "0.1.0"
description = "Atomic, Redis-backed rate limiting for Python: token bucket, leaky bucket, and sliding window algorithms in Lua."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
    { name = "Naman Dadhich" },
]
keywords = [
    "rate-limiter",
    "rate-limiting",
    "redis",
    "lua",
    "token-bucket",
    "leaky-bucket",
    "sliding-window",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "redis>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/batcoder-1/Redis-Ratekit"
Source = "https://github.com/batcoder-1/Redis-Ratekit"
Issues = "https://github.com/batcoder-1/Redis-Ratekit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ratekit = ["scripts/*.lua"]